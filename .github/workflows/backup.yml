name: backup

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --no-owner --no-privileges --format=plain "$DATABASE_URL" \
            | gzip > "thatme-$(date -u +%Y%m%d).sql.gz"

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: thatme-db-backup
          path: thatme-*.sql.gz
          retention-days: 30
