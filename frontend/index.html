<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with Anish's AI Twin</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f6f7; color: #111; }
    main { max-width: 720px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 1.1rem; margin: 0 0 12px; }
    #log { flex: 1; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .msg { margin: 0 0 12px; line-height: 1.45; white-space: pre-wrap; }
    .msg.user { text-align: right; color: #444; }
    .msg.error { color: #a00; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
    button { padding: 10px 16px; font: inherit; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    [hidden] { display: none !important; }
    #gate { max-width: 480px; margin: 40px auto; display: flex; flex-direction: column; gap: 10px; }
    #gate label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
    #gate .consent { flex-direction: row; align-items: flex-start; gap: 8px; }
    #gate small { color: #666; }
    #gate-error { color: #a00; font-size: 0.9rem; margin: 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      #gate small { color: #aaa; }
      #log { background: #1b1b1d; border-color: #333; }
      .msg.user { color: #bbb; }
      input { background: #1b1b1d; color: #eee; border-color: #444; }
      button { background: #eee; color: #111; }
    }
  </style>
</head>
<body>
  <main>
    <form id="gate" novalidate>
      <h1>Before we chat</h1>
      <p>Tell me a little about yourself. I store these details with your chat so Anish can follow up.</p>
      <label>Name <input name="name" type="text" maxlength="120" required autocomplete="name"></label>
      <label>Email <input name="email" type="email" maxlength="254" required autocomplete="email"></label>
      <label>Company <input name="company" type="text" maxlength="120" required autocomplete="organization"></label>
      <label>Role (optional) <input name="role" type="text" maxlength="120" autocomplete="organization-title"></label>
      <label>LinkedIn URL (optional) <input name="linkedin_url" type="url" maxlength="300" placeholder="https://linkedin.com/in/..."></label>
      <label class="consent">
        <input name="consent" type="checkbox" required>
        <span>I agree that Anish may store my name, email, company, role and LinkedIn URL along with my chat questions, and contact me about them. I can ask for this to be deleted at any time.</span>
      </label>
      <p id="gate-error" hidden></p>
      <button type="submit">Start chat</button>
    </form>
    <div id="chat" hidden>
      <h1>Chat with Anish's AI Twin</h1>
      <div id="log" aria-live="polite"></div>
      <form id="form">
        <input id="input" type="text" maxlength="1000" placeholder="Ask about experience, projects, education..." autocomplete="off" required>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </main>
  <script src="js/chat.js"></script>
</body>
</html>
